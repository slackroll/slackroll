---
name: CI

on:
  pull_request: ~
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      # renovate: datasource=github-releases depName=docker/buildx
      BUILDX_VERSION: "v0.36.1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Slackware 12.0 / Python 2.5
            dockerfile: ci/12.0/Dockerfile
            image_tag: slackroll-ci:12.0-python2
            test_command: py.test -vv
            coverage: false
            platforms: linux/386
          - name: Slackware 13.37 / Python 2.6
            dockerfile: ci/13.37/Dockerfile
            image_tag: slackroll-ci:13.37-python2
            test_command: py.test -vv
            coverage: false
            platforms: linux/amd64
          - name: Slackware 15.0 / Python 2.7
            dockerfile: ci/15.0/python2/Dockerfile
            image_tag: slackroll-ci:15.0-python2
            test_command: pytest --junitxml=pytest.xml --cov-report=term-missing:skip-covered --cov=slackroll -vv | tee pytest-coverage.txt
            coverage: true
            platforms: linux/amd64
          - name: Slackware 15.0 / Python 3.9
            dockerfile: ci/15.0/python3/Dockerfile
            image_tag: slackroll-ci:15.0-python3
            test_command: pytest --junitxml=pytest.xml --cov-report=term-missing:skip-covered --cov=slackroll -vv | tee pytest-coverage.txt
            coverage: true
            platforms: linux/amd64

    name: ${{ matrix.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - name: Configure buildkit image
        run: |
          BUILDKIT_IMAGE="$(awk '/^FROM / {print $2}' ci/buildkit/Dockerfile)"
          printf "BUILDKIT_IMAGE=%s\n" "$BUILDKIT_IMAGE" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build CI Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image_tag }}
          platforms: ${{ matrix.platforms }}
          cache-from: type=gha,scope=${{ matrix.image_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_tag }}

      - name: Run tests
        run: |
          docker run --rm -v "$(pwd):/slackroll" -w /slackroll ${{ matrix.image_tag }} bash -o pipefail -c '${{ matrix.test_command }}'

      - name: Coverage
        if: github.event_name == 'pull_request' && matrix.coverage
        uses: MishaKav/pytest-coverage-comment@09c28b6767e12a048e0b23e821ed03133ee48a1a # v1.11.0
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
          default-branch: master

  test-current:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
    name: Python ${{ matrix.python-version }}
    env:
      # renovate: datasource=github-releases depName=astral-sh/uv
      UV_VERSION: "0.12.5"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Run tests
        run: |
          uv run --python-preference only-managed --python ${{ matrix.python-version }} pytest

  lint:
    runs-on: ubuntu-24.04
    env:
      # renovate: datasource=github-releases depName=astral-sh/uv
      UV_VERSION: "0.12.5"
      # renovate: datasource=github-releases depName=j178/prek
      PREK_VERSION: "0.4.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PRE_COMMIT_PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: ${{ env.PREK_VERSION }}
