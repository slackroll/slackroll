---
name: CI

on:
  pull_request: ~
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_PYTHON: "3.9.25"

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=docker/buildx
      BUILDX_VERSION: "v0.36.1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Slackware 12.0 / Python 2.5
            dockerfile: ci/12.0/Dockerfile
            image_tag: slackroll-ci:12.0-python2
            test_command: py.test -vv
            coverage: false
            platforms: linux/386
          - name: Slackware 13.37 / Python 2.6
            dockerfile: ci/13.37/Dockerfile
            image_tag: slackroll-ci:13.37-python2
            test_command: py.test -vv
            coverage: false
            platforms: linux/amd64
          - name: Slackware 15.0 / Python 2.7
            dockerfile: ci/15.0/python2/Dockerfile
            image_tag: slackroll-ci:15.0-python2
            coverage_artefact: slackware15-python2
            test_command: COVERAGE_RCFILE=.coveragerc.ci COVERAGE_FILE=.coverage.python2 pytest --junitxml=pytest.xml --cov-report=term-missing:skip-covered --cov=slackroll -vv | tee pytest-coverage.txt
            coverage: true
            platforms: linux/amd64
          - name: Slackware 15.0 / Python 3.9
            dockerfile: ci/15.0/python3/Dockerfile
            image_tag: slackroll-ci:15.0-python3
            coverage_artefact: slackware15-python3
            test_command: COVERAGE_RCFILE=.coveragerc.ci COVERAGE_FILE=.coverage.python3 pytest --junitxml=pytest.xml --cov-report=term-missing:skip-covered --cov=slackroll -vv | tee pytest-coverage.txt
            coverage: true
            platforms: linux/amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - name: Configure buildkit image
        run: |
          BUILDKIT_IMAGE="$(awk '/^FROM / {print $2}' ci/buildkit/Dockerfile)"
          printf "BUILDKIT_IMAGE=%s\n" "$BUILDKIT_IMAGE" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          cache-binary: false
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build CI Docker image
        if: github.ref != 'refs/heads/master'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image_tag }}
          platforms: ${{ matrix.platforms }}
          cache-from: type=gha,scope=${{ matrix.image_tag }}

      - name: Build CI Docker image (cache write)
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image_tag }}
          platforms: ${{ matrix.platforms }}
          cache-from: type=gha,scope=${{ matrix.image_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_tag }}

      - name: Configure coverage for container runs
        if: matrix.coverage
        run: |
          cat > .coveragerc.ci <<'EOF'
          [run]
          relative_files = True
          source =
              slackroll
          EOF

      - name: Run tests
        env:
          IMAGE_TAG: ${{ matrix.image_tag }}
          TEST_COMMAND: ${{ matrix.test_command }}
        run: |
          docker run --rm -v "$(pwd):/slackroll" -w /slackroll "$IMAGE_TAG" bash -o pipefail -c "$TEST_COMMAND"

      - name: Upload coverage artefacts
        if: github.event_name == 'pull_request' && matrix.coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.coverage_artefact }}
          path: .coverage*
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: Coverage report
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write # Required for MishaKav/pytest-coverage-comment to post/update PR comments.
    env:
      # renovate: datasource=github-releases depName=astral-sh/uv
      UV_VERSION: "0.12.5"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - name: Download Slackware 15.0 python 2.7 coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-slackware15-python2
          path: coverage/python2

      - name: Download Slackware 15.0 python 3.9 coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-slackware15-python3
          path: coverage/python3

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Merge coverage reports
        run: |
          cat > .coveragerc.ci <<'EOF'
          [run]
          relative_files = True
          source =
              slackroll
          EOF
          uv sync
          uv run coverage combine --rcfile=.coveragerc.ci coverage/python2/.coverage* coverage/python3/.coverage*
          uv run coverage xml --rcfile=.coveragerc.ci -o coverage.xml

      - name: Coverage
        uses: MishaKav/pytest-coverage-comment@09c28b6767e12a048e0b23e821ed03133ee48a1a # v1.11.0
        with:
          pytest-xml-coverage-path: ./coverage.xml
          default-branch: master

  test-current:
    runs-on: ubuntu-24.04
    name: Python 3.12 (-current)
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=astral-sh/uv
      UV_VERSION: "0.12.5"
      PYTHON_VERSION: "3.12.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Run tests
        run: |
          uv run pytest

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=astral-sh/uv
      UV_VERSION: "0.12.5"
      # renovate: datasource=github-releases depName=j178/prek
      PREK_VERSION: "0.4.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: ${{ env.PREK_VERSION }}
