---
name: CI

on:
  pull_request: ~
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=python-version depName=python
  DEFAULT_PYTHON_VERSION: "3.12.16"

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=docker/buildx
      BUILDX_VERSION: "v0.38.1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Slackware 12.0 / Python 2.5
            dockerfile: ci/12.0/Dockerfile
            image_tag: slackroll-ci:12.0-python2
            test_command: py.test -vv
            coverage: false
            platforms: linux/386
          - name: Slackware 13.37 / Python 2.6
            dockerfile: ci/13.37/Dockerfile
            image_tag: slackroll-ci:13.37-python2
            test_command: py.test -vv
            coverage: false
            platforms: linux/amd64
          - name: Slackware 15.0 / Python 2.7
            dockerfile: ci/15.0/python2/Dockerfile
            image_tag: slackroll-ci:15.0-python2
            test_command: pytest -vv
            coverage: false
            platforms: linux/amd64
          - name: Slackware 15.0 / Python 3.9
            dockerfile: ci/15.0/python3/Dockerfile
            image_tag: slackroll-ci:15.0-python3
            test_command: pytest -vv
            coverage: false
            platforms: linux/amd64
          - name: Slackware -current / Python 2.7
            dockerfile: ci/current/python2/Dockerfile
            image_tag: slackroll-ci:current-python2
            coverage_artefact: slackware-current-python2
            test_command: COVERAGE_RCFILE=.coveragerc.ci COVERAGE_FILE=.coverage.python2 pytest --junitxml=pytest.xml --cov-report=term-missing:skip-covered --cov=slackroll -vv | tee pytest-coverage.txt
            coverage: true
            platforms: linux/amd64
          - name: Slackware -current / Python 3.12
            dockerfile: ci/current/python3/Dockerfile
            image_tag: slackroll-ci:current-python3
            coverage_artefact: slackware-current-python3
            test_command: COVERAGE_RCFILE=.coveragerc.ci COVERAGE_FILE=.coverage.python3 pytest --junitxml=pytest.xml --cov-report=term-missing:skip-covered --cov=slackroll -vv | tee pytest-coverage.txt
            coverage: true
            platforms: linux/amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - name: Configure buildkit image
        run: |
          BUILDKIT_IMAGE="$(awk '/^FROM / {print $2}' ci/buildkit/Dockerfile)"
          printf "BUILDKIT_IMAGE=%s\n" "$BUILDKIT_IMAGE" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          cache-binary: false
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build CI Docker image
        if: github.ref != 'refs/heads/master'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image_tag }}
          platforms: ${{ matrix.platforms }}
          cache-from: type=gha,scope=${{ matrix.image_tag }}

      - name: Build CI Docker image (cache write)
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image_tag }}
          platforms: ${{ matrix.platforms }}
          cache-from: type=gha,scope=${{ matrix.image_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_tag }}

      - name: Configure coverage for container runs
        if: matrix.coverage
        run: |
          cat > .coveragerc.ci <<'EOF'
          [run]
          relative_files = True
          source =
              slackroll
          EOF

      - name: Run tests
        env:
          IMAGE_TAG: ${{ matrix.image_tag }}
          TEST_COMMAND: ${{ matrix.test_command }}
        run: |
          docker run --rm -v "$(pwd):/slackroll" -w /slackroll "$IMAGE_TAG" bash -o pipefail -c "$TEST_COMMAND"

      - name: Upload coverage artefacts
        if: github.event_name == 'pull_request' && matrix.coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.coverage_artefact }}
          path: .coverage*
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: Coverage report
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write # Required for MishaKav/pytest-coverage-comment to post/update PR comments.
    env:
      # renovate: datasource=github-releases depName=astral-sh/uv
      UV_VERSION: "0.13.6"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - name: Download Slackware -current python 2.7 coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-slackware-current-python2
          path: coverage/python2

      - name: Download Slackware -current python 3.12 coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-slackware-current-python3
          path: coverage/python3

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}

      - name: Merge coverage reports
        run: |
          cat > .coveragerc.ci <<'EOF'
          [run]
          relative_files = True
          source =
              slackroll
          EOF
          uv sync
          uv run coverage combine --rcfile=.coveragerc.ci coverage/python2/.coverage* coverage/python3/.coverage*
          uv run coverage xml --rcfile=.coveragerc.ci -o coverage.xml

      - name: Coverage
        uses: MishaKav/pytest-coverage-comment@9516bf7f32a9229cf18d5e1717ae387c7154f279 # v1.13.0
        with:
          pytest-xml-coverage-path: ./coverage.xml
          default-branch: master

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=astral-sh/uv
      UV_VERSION: "0.13.6"
      # renovate: datasource=github-releases depName=j178/prek
      PREK_VERSION: "0.5.9"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Run prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: ${{ env.PREK_VERSION }}
